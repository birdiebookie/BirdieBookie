<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BirdieBookie - Invite Players</title>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

.wrap{
    max-width:520px;
    margin:0 auto;
    padding:16px 16px 40px;
}

h1{
    color:#00ff99;
    text-align:center;
    font-size:32px;
    margin:18px 0 20px;
}

.panel{
    border:2px solid #00ff99;
    border-radius:14px;
    padding:16px;
    margin-bottom:18px;
}

h2{
    color:#00ff99;
    margin:0 0 12px;
    font-size:16px;
    letter-spacing:0.5px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
    font-size:14px;
    color:#ccc;
}

input[type="text"]{
    width:100%;
    padding:14px;
    border-radius:8px;
    border:2px solid #00ff99;
    background:#111;
    color:#fff;
    font-size:18px;
    box-sizing:border-box;
}

.roomBox{
    text-align:center;
    padding:14px;
    border-radius:10px;
    background:#00291c;
    border:2px solid #00ff99;
}

.roomBox .code{
    font-size:30px;
    font-weight:bold;
    color:#00ff99;
    letter-spacing:4px;
}

.roomBox.warn{
    background:#2a1500;
    border-color:#ffdd44;
}

.roomBox.warn .code{
    color:#ffdd44;
    font-size:16px;
    letter-spacing:normal;
}

.chips{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
}

.chip{
    padding:10px 16px;
    border-radius:20px;
    border:2px solid #00ff99;
    background:#111;
    color:#00ff99;
    font-weight:bold;
    font-size:14px;
    cursor:pointer;
    user-select:none;
}

.chip.on{
    background:#00ff99;
    color:#000;
}

.chipNote{
    font-size:12px;
    color:#ffdd44;
    margin-top:8px;
    min-height:14px;
}

.playerRow{
    border:2px solid #00ff99;
    border-radius:12px;
    padding:14px;
    margin-bottom:12px;
}

.playerTitle{
    font-size:18px;
    color:#00ff99;
    font-weight:bold;
    margin-bottom:10px;
}

.playerRow input{
    margin-bottom:10px;
}

.playerRow input:last-child{
    margin-bottom:0;
}

.toggle-row{
    display:flex;
    align-items:center;
    gap:14px;
    margin:18px 0;
    cursor:pointer;
}

.toggle-box{
    width:44px;
    height:44px;
    border-radius:10px;
    border:3px solid #00ff99;
    background:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:24px;
    flex-shrink:0;
    transition:background 0.2s;
}

.toggle-box.on{
    background:#00ff99;
    color:#000;
}

.toggle-label{
    font-size:16px;
    font-weight:bold;
    color:#00ff99;
}

#extra{
    display:none;
}

button, .sendBtn{
    width:100%;
    padding:16px;
    font-size:20px;
    font-weight:bold;
    background:#00ff99;
    color:#000;
    border:none;
    border-radius:12px;
    cursor:pointer;
    margin-top:6px;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.textLinks{
    margin-top:18px;
    display:none;
}

.textLink{
    display:block;
    text-decoration:none;
    text-align:center;
    padding:16px;
    font-size:18px;
    font-weight:bold;
    background:#111;
    color:#00ff99;
    border:2px solid #00ff99;
    border-radius:12px;
    margin-bottom:10px;
}

.textLink.sent{
    background:#00ff99;
    color:#000;
}

.hint{
    font-size:13px;
    color:#999;
    text-align:center;
    margin-top:4px;
}
</style>
</head>

<body>

<div class="wrap">

<h1>🏌️ Invite Players</h1>

<div class="panel">
    <h2>ROOM</h2>
    <div class="roomBox" id="roomBox">
        <div class="code" id="roomCodeText">Loading...</div>
    </div>
</div>

<div class="panel">
    <label>Host Name</label>
    <input type="text" id="hostName" placeholder="Your name">
</div>

<div class="panel">
    <h2>GAMES (pick up to 2)</h2>
    <div class="chips" id="gameChips"></div>
    <div class="chipNote" id="chipNote"></div>
</div>

<div id="playersWrap">

    <div class="playerRow">
        <div class="playerTitle">PLAYER 1</div>
        <input type="text" class="playerName" placeholder="Name">
        <input type="text" class="playerPhone" placeholder="Phone number" inputmode="tel">
    </div>

    <div class="playerRow">
        <div class="playerTitle">PLAYER 2</div>
        <input type="text" class="playerName" placeholder="Name">
        <input type="text" class="playerPhone" placeholder="Phone number" inputmode="tel">
    </div>

    <div class="playerRow">
        <div class="playerTitle">PLAYER 3</div>
        <input type="text" class="playerName" placeholder="Name">
        <input type="text" class="playerPhone" placeholder="Phone number" inputmode="tel">
    </div>

</div>

<div class="toggle-row" onclick="toggleExtra()">
    <div class="toggle-box" id="extraBox">＋</div>
    <div class="toggle-label">Add Golfers 4–7</div>
</div>

<div id="extra">

    <div class="playerRow">
        <div class="playerTitle">PLAYER 4</div>
        <input type="text" class="playerName" placeholder="Name">
        <input type="text" class="playerPhone" placeholder="Phone number" inputmode="tel">
    </div>

    <div class="playerRow">
        <div class="playerTitle">PLAYER 5</div>
        <input type="text" class="playerName" placeholder="Name">
        <input type="text" class="playerPhone" placeholder="Phone number" inputmode="tel">
    </div>

    <div class="playerRow">
        <div class="playerTitle">PLAYER 6</div>
        <input type="text" class="playerName" placeholder="Name">
        <input type="text" class="playerPhone" placeholder="Phone number" inputmode="tel">
    </div>

    <div class="playerRow">
        <div class="playerTitle">PLAYER 7</div>
        <input type="text" class="playerName" placeholder="Name">
        <input type="text" class="playerPhone" placeholder="Phone number" inputmode="tel">
    </div>

</div>

<div class="toggle-row" onclick="toggleRemember()">
    <div class="toggle-box" id="rememberBox">＋</div>
    <div class="toggle-label">Remember These Golfers</div>
</div>

<button id="sendInvitesBtn">SEND INVITES</button>
<div class="hint">Tap SEND, then tap each player's text button below.</div>

<div class="textLinks" id="textLinks"></div>

</div>

<script>

const GAME_OPTIONS = ["Nassau","Skins","Wolf","Left Right","Vegas","Quota","Rabbit","Stableford","Bingo Bango Bongo","Game of 9","Chairman","Press"];
let selectedGames = [];

document.addEventListener("DOMContentLoaded", function(){
    loadHost();
    buildGameChips();
    loadRoomCode();
    loadRememberedGolfers();
});

/* HOST */
function loadHost(){
    const host = localStorage.getItem("hostName");
    if(host) document.getElementById("hostName").value = host;
    document.getElementById("hostName").addEventListener("input", function(){
        localStorage.setItem("hostName", this.value);
    });
}

/* ROOM CODE - reads what the scorecard already saved. No network call, no mismatch. */
function loadRoomCode(){
    const box = document.getElementById("roomBox");
    const text = document.getElementById("roomCodeText");
    const code = localStorage.getItem("birdiebookieRoomCode");
    const btn = document.getElementById("sendInvitesBtn");

    if(code){
        text.textContent = code;
        box.classList.remove("warn");
        btn.disabled = false;
    } else {
        text.textContent = "No active room yet — open the scorecard and tap SAVE TO CLOUD first, then come back here.";
        box.classList.add("warn");
        btn.disabled = true;
    }
}

/* GAMES as tap chips, max 2 */
function buildGameChips(){
    const wrap = document.getElementById("gameChips");
    let saved = [];
    try{ saved = JSON.parse(localStorage.getItem("bb_games") || "[]"); } catch(e){ saved = []; }
    selectedGames = saved;

    wrap.innerHTML = GAME_OPTIONS.map(g =>
        `<div class="chip${saved.includes(g)?' on':''}" data-game="${g}">${g}</div>`
    ).join("");

    wrap.querySelectorAll(".chip").forEach(chip => {
        chip.addEventListener("click", function(){
            const game = this.getAttribute("data-game");
            const note = document.getElementById("chipNote");
            const isOn = this.classList.contains("on");

            if(isOn){
                this.classList.remove("on");
                selectedGames = selectedGames.filter(g => g !== game);
                note.textContent = "";
            } else {
                if(selectedGames.length >= 2){
                    note.textContent = "You can only pick 2 games. Tap one off first.";
                    return;
                }
                this.classList.add("on");
                selectedGames.push(game);
                note.textContent = "";
            }
            localStorage.setItem("bb_games", JSON.stringify(selectedGames));
        });
    });
}

/* ADD GOLFERS 4-7 */
function toggleExtra(){
    const box = document.getElementById("extraBox");
    const extra = document.getElementById("extra");
    const isOn = box.classList.toggle("on");
    box.textContent = isOn ? "✓" : "＋";
    extra.style.display = isOn ? "block" : "none";
}

/* REMEMBER GOLFERS */
function toggleRemember(){
    const box = document.getElementById("rememberBox");
    const isOn = box.classList.toggle("on");
    box.textContent = isOn ? "✓" : "＋";
    localStorage.setItem("bb_rememberGolfers", isOn ? "true" : "false");
}

function loadRememberedGolfers(){
    const remember = localStorage.getItem("bb_rememberGolfers") === "true";
    const box = document.getElementById("rememberBox");
    if(remember){
        box.classList.add("on");
        box.textContent = "✓";
    }
    let saved = [];
    try{ saved = JSON.parse(localStorage.getItem("bb_savedGolfers") || "[]"); } catch(e){ saved = []; }
    const names = document.querySelectorAll(".playerName");
    const phones = document.querySelectorAll(".playerPhone");
    saved.forEach((p, i) => {
        if(names[i] && p.name) names[i].value = p.name;
        if(phones[i] && p.phone) phones[i].value = p.phone;
    });
}

/* Build an sms: link that works on both iPhone and Android */
function smsHref(phone, body){
    const digits = phone.replace(/[^\d+]/g, "");
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const sep = isIOS ? "&" : "?";
    return "sms:" + digits + sep + "body=" + encodeURIComponent(body);
}

/* SEND INVITES */
document.getElementById("sendInvitesBtn").addEventListener("click", function(){
    const room = localStorage.getItem("birdiebookieRoomCode");
    if(!room){
        alert("No active room yet. Open the scorecard and tap SAVE TO CLOUD first.");
        return;
    }

    const hostName = document.getElementById("hostName").value.trim();
    const names = Array.from(document.querySelectorAll(".playerName"));
    const phones = Array.from(document.querySelectorAll(".playerPhone"));
    const games = selectedGames.join(" & ") || "Golf";
    const joinUrl = window.location.origin + "/scorecards.html?room=" + encodeURIComponent(room);

    const players = [];
    for(let i = 0; i < names.length; i++){
        const name = names[i].value.trim();
        const phone = phones[i].value.trim();
        if(name || phone) players.push({name, phone});
    }

    if(players.length === 0){
        alert("Enter at least one golfer's name and phone number.");
        return;
    }
    if(!players.some(p => p.phone)){
        alert("Enter at least one phone number.");
        return;
    }

    if(document.getElementById("bb_remembered") === null &&
       localStorage.getItem("bb_rememberGolfers") === "true"){
        localStorage.setItem("bb_savedGolfers", JSON.stringify(players));
    }

    const linksWrap = document.getElementById("textLinks");
    linksWrap.innerHTML = "";
    linksWrap.style.display = "block";

    players.forEach(p => {
        if(!p.phone) return;
        const greeting = p.name ? "Hi " + p.name : "Hi";
        const message = greeting + "!\n\n" +
            (hostName ? hostName + " invited" : "You're invited") + " you to a BirdieBookie golf round!\n\n" +
            "Games: " + games + "\n\n" +
            "Tap to join the scorecard:\n" + joinUrl;

        const a = document.createElement("a");
        a.className = "textLink";
        a.href = smsHref(p.phone, message);
        a.textContent = "📱 Text " + (p.name || p.phone);
        a.addEventListener("click", function(){
            this.classList.add("sent");
            this.textContent = "✓ Sent to " + (p.name || p.phone);
        });
        linksWrap.appendChild(a);
    });

    linksWrap.scrollIntoView({behavior:"smooth", block:"start"});
});

</script>

</body>
</html>
