<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BirdieBookie - Invite Players</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

.wrap{
    max-width:1100px;
    margin:30px auto;
    padding:20px;
}

h1{
    color:#00ff99;
    text-align:center;
    font-size:52px;
    margin:20px 0 35px;
}

.panel{
    border:2px solid #00ff99;
    border-radius:14px;
    padding:18px;
    margin-bottom:22px;
}

h2{
    color:#00ff99;
    margin:0 0 16px;
}

.grid3{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:20px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
}

input[type="text"],
select{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:2px solid #00ff99;
    background:#111;
    color:#fff;
    font-size:18px;
}

select option{
    background:#111;
    color:#fff;
}

/* COURSE AREA */

.course-help{
    color:#888;
    font-size:14px;
    margin-top:8px;
}

/* GAMES */

#selectedGames{
    height:170px;
    cursor:pointer;
}

#selectedGames option{
    padding:7px;
}

.game-help{
    color:#888;
    font-size:14px;
    margin-top:8px;
}

/* PLAYERS */

.playerRow{
    display:grid;
    grid-template-columns:180px 1fr 1fr;
    gap:18px;
    align-items:center;

    border:2px solid #00ff99;
    border-radius:12px;

    padding:18px;
    margin:16px 0;
}

.playerTitle{
    font-size:30px;
    color:#00ff99;
    font-weight:bold;
}

/* TOGGLES */

.toggle-row{
    display:flex;
    align-items:center;
    gap:18px;

    margin:24px 0;
    cursor:pointer;
}

.toggle-box{
    width:60px;
    height:60px;

    border-radius:12px;
    border:3px solid #00ff99;

    background:#111;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:32px;

    flex-shrink:0;
}

.toggle-box.on{
    background:#00ff99;
    color:#000;
}

.toggle-label{
    font-size:28px;
    font-weight:bold;
    color:#00ff99;
}

#extra{
    display:none;
}

/* BUTTON */

button{
    width:100%;
    padding:18px;

    font-size:30px;
    font-weight:bold;

    background:#00ff99;
    color:#000;

    border:none;
    border-radius:12px;

    cursor:pointer;

    margin-top:10px;
}

@media(max-width:700px){

    .grid3{
        grid-template-columns:1fr;
    }

    .playerRow{
        grid-template-columns:1fr;
        gap:10px;
        padding:14px;
    }

    .playerTitle{
        font-size:24px;
    }

    h1{
        font-size:36px;
    }

    input[type="text"],
    select{
        font-size:16px;
        padding:10px;
    }

    .toggle-label{
        font-size:20px;
    }

    .toggle-box{
        width:44px;
        height:44px;
        font-size:24px;
    }

}

</style>

</head>

<body>

<div class="wrap">

<!-- PLAYER 2 -->

<div class="playerRow">

PLAYER 2

>

<div>

    type="text"

<!-- PLAYER 3 -->

<!-- PLAYER 6 -->

PLAYER 6

>

</div>

<div>

<label>Phone Number</label>

<input

<!-- PLAYER 7 -->

<script>

/* =====================================================
   BIRDIEBOOKIE INVITE
   ===================================================== */


/* =====================================================
   COURSE DATABASE
   ===================================================== */

const courseData = {

    OH: [

        "Sharon Woods Golf Course",
        "Mill Golf Course",
        "Oasis Golf Club",
        "Beckett Ridge",
        "Blue Ash Golf Course",
        "Mason Golf Center",
        "Walden Ponds Golf Course",
        "Hickory Woods Golf Course",
        "Stonelick Hills Golf Course",
        "Elks Run Golf Club",
        "Cedar Trace Golf Club"

    ],

    SC: [

        "Dunes Golf & Beach Club",
        "Caledonia Golf & Fish Club",
        "True Blue Golf Club",
        "Tidewater Golf Club",
        "TPC Myrtle Beach",
        "Grande Dunes Resort Course",
        "Barefoot Resort Dye Course",
        "Barefoot Resort Love Course",
        "Barefoot Resort Fazio Course",
        "Barefoot Resort Norman Course",
        "King's North at Myrtle Beach National",
        "Prestwick Country Club",
        "Pine Lakes Country Club",
        "Pawleys Plantation Golf & Country Club",
        "River Club",
        "Thistle Golf Club",
        "Long Bay Club",
        "Rivers Edge Golf Club",
        "World Tour Golf Links",
        "Arcadian Shores Golf Club",
        "Willbrook Plantation Golf Club",
        "Heritage Club",
        "Tradition Golf Club",
        "Arrowhead Country Club",
        "River Hills Golf Club",
        "Legends Moorland Course",
        "Oyster Bay Golf Links",
        "Glen Dornoch Waterway Golf Links",
        "Wild Wing Avocet Course",
        "Myrtlewood Palmetto Course"

    ]

};


/* =====================================================
   START PAGE
   ===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadHost();

        loadRoom();

        loadRememberedGolfers();

        setupStateAndCourse();

        setupGames();

    }
);


/* =====================================================
   HOST
   ===================================================== */

function loadHost(){

    const savedHost =
        localStorage.getItem(
            "birdiebookieHostName"
        );

    if(savedHost){

        document.getElementById(
            "hostName"
        ).value = savedHost;

    }

}


/* =====================================================
   ROOM NUMBER
   ===================================================== */

function loadRoom(){

    const savedRoom =
        localStorage.getItem(
            "birdiebookieRoomCode"
        );

    if(savedRoom){

        document.getElementById(
            "roomCode"
        ).value = savedRoom;

    }

}


/* =====================================================
   STATE + COURSE
   ===================================================== */

function setupStateAndCourse(){

    const stateSelect =
        document.getElementById(
            "stateSelect"
        );

    const courseSelect =
        document.getElementById(
            "courseName"
        );


    /*
       When state changes, rebuild the course list.
    */

    stateSelect.addEventListener(
        "change",
        function(){

            buildCourseList(
                stateSelect.value
            );

        }
    );


    /*
       Look for the course saved by the
       Courses / Scorecard system.
    */

    const savedCourse =
        localStorage.getItem(
            "selectedCourse"
        );


    /*
       If we have a saved course, find its state.
    */

    if(savedCourse){

        let foundState = "";

        for(
            const state in courseData
        ){

            if(
                courseData[state]
                .includes(savedCourse)
            ){

                foundState = state;

                break;

            }

        }


        /*
           If the saved course is known,
           select its state and course.
        */

        if(foundState){

            stateSelect.value =
                foundState;

            buildCourseList(
                foundState
            );

            courseSelect.value =
                savedCourse;

        }

    }

}


/* =====================================================
   BUILD COURSE LIST
   ===================================================== */

function buildCourseList(state){

    const courseSelect =
        document.getElementById(
            "courseName"
        );


    courseSelect.innerHTML =
        '<option value="">Select Course</option>';


    if(!state){

        return;

    }


    const courses =
        courseData[state] || [];


    courses.forEach(
        function(course){

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                course;

            option.textContent =
                course;

            courseSelect.appendChild(
                option
            );

        }
    );


    /*
       Save selected course when changed.
    */

    courseSelect.onchange =
        function(){

            if(this.value){

                localStorage.setItem(
                    "selectedCourse",
                    this.value
                );

            }

        };

}


/* =====================================================
   GAMES
   ===================================================== */

function setupGames(){

    const gamesSelect =
        document.getElementById(
            "selectedGames"
        );


    /*
       Load the games selected on the
       previous page.
    */

    let savedGames = [];


    const bbGames =
        localStorage.getItem(
            "bb_games"
        );


    if(bbGames){

        try{

            const parsed =
                JSON.parse(
                    bbGames
                );

            if(
                Array.isArray(parsed)
            ){

                savedGames =
                    parsed;

            }

        }
        catch(error){

            console.log(
                "Could not read bb_games"
            );

        }

    }


    /*
       Also support the older key.
    */

    if(
        savedGames.length === 0
    ){

        const oldGames =
            localStorage.getItem(
                "selectedGames"
            );

        if(oldGames){

            try{

                const parsed =
                    JSON.parse(
                        oldGames
                    );

                if(
                    Array.isArray(parsed)
                ){

                    savedGames =
                        parsed;

                }

            }
            catch(error){

                console.log(
                    "Could not read selectedGames"
                );

            }

        }

    }


    /*
       Select every saved game.
    */

    savedGames.forEach(
        function(game){

            const option =
                Array.from(
                    gamesSelect.options
                ).find(
                    function(option){

                        return (
                            option.value ===
                            game
                        );

                    }
                );


            if(option){

                option.selected =
                    true;

            }

        }
    );


    /*
       Normal click toggles games.
       No Ctrl key required.
    */

    gamesSelect.addEventListener(
        "mousedown",
        function(event){

            const option =
                event.target.closest(
                    "option"
                );


            if(!option){

                return;

            }


            event.preventDefault();


            option.selected =
                !option.selected;


            saveGames();

        }
    );


    gamesSelect.addEventListener(
        "change",
        saveGames
    );

}


/* =====================================================
   SAVE GAMES
   ===================================================== */

function saveGames(){

    const gamesSelect =
        document.getElementById(
            "selectedGames"
        );


    const games =
        Array.from(
            gamesSelect.selectedOptions
        ).map(
            function(option){

                return option.value;

            }
        );


    localStorage.setItem(
        "selectedGames",
        JSON.stringify(games)
    );


    localStorage.setItem(
        "bb_games",
        JSON.stringify(games)
    );

}


/* =====================================================
   ADD GOLFERS
   ===================================================== */

function toggleExtra(){

    const box =
        document.getElementById(
            "extraBox"
        );

    const extra =
        document.getElementById(
            "extra"
        );


    const isOn =
        box.classList.toggle(
            "on"
        );


    box.textContent =
        isOn ? "✓" : "＋";


    extra.style.display =
        isOn
        ? "block"
        : "none";

}


/* =====================================================
   REMEMBER GOLFERS
   ===================================================== */

function toggleRemember(){

    const box =
        document.getElementById(
            "rememberBox"
        );


    const isOn =
        box.classList.toggle(
            "on"
        );


    box.textContent =
        isOn ? "✓" : "＋";


    if(isOn){

        saveGolfers();

    }

}


/* =====================================================
   SAVE GOLFERS
   ===================================================== */

function saveGolfers(){

    const golfers = [];


    for(
        let i = 1;
        i <= 7;
        i++
    ){

        const name =
            document.getElementById(
                "player" +
                i +
                "Name"
            );

        const phone =
            document.getElementById(
                "player" +
                i +
                "Phone"
            );


        if(!name){

            continue;

        }


        if(
            name.value.trim() ||
            phone.value.trim()
        ){

            golfers.push({

                name:
                    name.value.trim(),

                phone:
                    phone.value.trim()

            });

        }

    }


    localStorage.setItem(
        "birdiebookieRememberedGolfers",
        JSON.stringify(golfers)
    );

}


/* =====================================================
   LOAD GOLFERS
   ===================================================== */

function loadRememberedGolfers(){

    const saved =
        localStorage.getItem(
            "birdiebookieRememberedGolfers"
        );


    if(!saved){

        return;

    }


    try{

        const golfers =
            JSON.parse(saved);


        if(
            !Array.isArray(golfers)
        ){

            return;

        }


        golfers.forEach(
            function(golfer,index){

                const number =
                    index + 1;


                if(number > 7){

                    return;

                }


                const name =
                    document.getElementById(
                        "player" +
                        number +
                        "Name"
                    );


                const phone =
                    document.getElementById(
                        "player" +
                        number +
                        "Phone"
                    );


                if(name){

                    name.value =
                        golfer.name || "";

                }


                if(phone){

                    phone.value =
                        golfer.phone || "";

                }

            }
        );


    }
    catch(error){

        console.log(
            "Could not load golfers"
        );

    }

}


/* =====================================================
   SEND INVITES
   ===================================================== */

document
.getElementById(
    "sendInvitesBtn"
)
.addEventListener(
    "click",
    async function(){

        const host =
            document.getElementById(
                "hostName"
            ).value.trim();


        const state =
            document.getElementById(
                "stateSelect"
            ).value;


        const course =
            document.getElementById(
                "courseName"
            ).value;


        const gamesSelect =
            document.getElementById(
                "selectedGames"
            );


        const games =
            Array.from(
                gamesSelect.selectedOptions
            ).map(
                function(option){

                    return option.value;

                }
            );


        const room =
            document.getElementById(
                "roomCode"
            ).value;


        saveGames();


        if(
            document
            .getElementById(
                "rememberBox"
            )
            .classList
            .contains("on")
        ){

            saveGolfers();

        }


        const message =

            "🏌️ BirdieBookie Golf Invitation\n\n" +

            (
                host
                ? "Host: " +
                  host +
                  "\n"
                : ""
            ) +

            "State: " +
            (
                state || "Not selected"
            ) +
            "\n" +

            "Course: " +
            (
                course || "Not selected"
            ) +
            "\n" +

            "Games: " +
            (
                games.length
                ? games.join(", ")
                : "No games selected"
            ) +
            "\n" +

            "Round / Room Number: " +
            (
                room || "Not available"
            ) +
            "\n\n" +

            "Join the round on BirdieBookie " +
            "and use the Room Number above.";


        if(navigator.share){

            try{

                await navigator.share({

                    title:
                        "BirdieBookie Golf Invitation",

                    text:
                        message

                });

            }
            catch(error){

                if(
                    error.name !==
                    "AbortError"
                ){

                    alert(
                        "Unable to open the share menu."
                    );

                }

            }

        }
        else{

            try{

                await navigator.clipboard.writeText(
                    message
                );

                alert(
                    "INVITATION COPIED!\n\n" +
                    "Paste it into a text, email, " +
                    "or Messenger."
                );

            }
            catch(error){

                alert(message);

            }

        }

    }
);

</script>
