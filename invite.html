<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BirdieBookie - Invite Players</title>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

.wrap{
    max-width:1100px;
    margin:30px auto;
    padding:20px;
}

h1{
    color:#00ff99;
    text-align:center;
    font-size:52px;
}

.panel{
    border:2px solid #00ff99;
    border-radius:14px;
    padding:18px;
    margin-bottom:22px;
}

h2{
    color:#00ff99;
    margin:0 0 16px;
}

.grid3{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:20px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
}

input[type="text"]{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:2px solid #00ff99;
    background:#111;
    color:#fff;
    font-size:18px;
    box-sizing:border-box;
}

.playerRow{
    display:grid;
    grid-template-columns:180px 1fr 1fr;
    gap:18px;
    align-items:center;
    border:2px solid #00ff99;
    border-radius:12px;
    padding:18px;
    margin:16px 0;
}

.playerTitle{
    font-size:30px;
    color:#00ff99;
    font-weight:bold;
}

/* TOGGLE BUTTON STYLES */
.toggle-row {
    display:flex;
    align-items:center;
    gap:18px;
    margin:24px 0;
    cursor:pointer;
}

.toggle-box {
    width:60px;
    height:60px;
    border-radius:12px;
    border:3px solid #00ff99;
    background:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    flex-shrink:0;
    transition: background 0.2s;
}

.toggle-box.on {
    background:#00ff99;
    color:#000;
}

.toggle-label {
    font-size:28px;
    font-weight:bold;
    color:#00ff99;
}

#extra{
    display:none;
}

button{
    width:100%;
    padding:18px;
    font-size:30px;
    font-weight:bold;
    background:#00ff99;
    color:#000;
    border:none;
    border-radius:12px;
    cursor:pointer;
    margin-top:10px;
}
@media (max-width:700px){
    .grid3{
        grid-template-columns:1fr;
    }
    .playerRow{
        grid-template-columns:1fr;
        gap:10px;
        padding:14px;
    }
    .playerTitle{
        font-size:24px;
    }
    h1{
        font-size:36px;
    }
    input[type="text"]{
        font-size:16px;
        padding:10px;
    }
    .toggle-label{
        font-size:20px;
    }
    .toggle-box{
        width:44px;
        height:44px;
        font-size:24px;
    }
}
</style>

</head>

<body>

<div class="wrap">

<h1>🏌️ Invite Players</h1>

<div class="grid3">

<div class="panel">
<h2>HOST INFORMATION</h2>
<label>Host Name</label>
<input type="text" id="hostName">
</div>

<div class="panel">
<h2>ROUND INFORMATION</h2>
<label>Course</label>
<select id="courseName">
    <option value="">Select Course</option>
</select>
</div>

<div class="panel">
<h2>GAMES</h2>
<label>Selected Games</label>
<select id="selectedGames" multiple size="4">
<option value="Nassau">Nassau</option>
<option value="Skins">Skins</option>
<option value="Wolf">Wolf</option>
<option value="Left Right">Left Right</option>
<option value="Vegas">Vegas</option>
<option value="Quota">Quota</option>
<option value="Rabbit">Rabbit</option>
<option value="Stableford">Stableford</option>
<option value="Bingo Bango Bongo">Bingo Bango Bongo</option>
<option value="Game of 9">Game of 9</option>
<option value="Chairman">Chairman</option>
<option value="Press">Press</option>
</select>
<label style="margin-top:12px;">Round / Room Number</label>
<input type="text" id="roomCode" readonly>
</div>

</div>

<div class="playerRow">
<div class="playerTitle">PLAYER 1</div>
<div><label>Name</label><input type="text"></div>
<div><label>Phone Number</label><input type="text"></div>
</div>

<div class="playerRow">
<div class="playerTitle">PLAYER 2</div>
<div><label>Name</label><input type="text"></div>
<div><label>Phone Number</label><input type="text"></div>
</div>

<div class="playerRow">
<div class="playerTitle">PLAYER 3</div>
<div><label>Name</label><input type="text"></div>
<div><label>Phone Number</label><input type="text"></div>
</div>

<!-- ADD GOLFERS TOGGLE -->
<div class="toggle-row" onclick="toggleExtra()">
    <div class="toggle-box" id="extraBox">＋</div>
    <div class="toggle-label">Add Golfers 4–7</div>
</div>

<div id="extra">
<div class="playerRow">
<div class="playerTitle">PLAYER 4</div>
<div><label>Name</label><input type="text"></div>
<div><label>Phone Number</label><input type="text"></div>
</div>

<div class="playerRow">
<div class="playerTitle">PLAYER 5</div>
<div><label>Name</label><input type="text"></div>
<div><label>Phone Number</label><input type="text"></div>
</div>

<div class="playerRow">
<div class="playerTitle">PLAYER 6</div>
<div><label>Name</label><input type="text"></div>
<div><label>Phone Number</label><input type="text"></div>
</div>

<div class="playerRow">
<div class="playerTitle">PLAYER 7</div>
<div><label>Name</label><input type="text"></div>
<div><label>Phone Number</label><input type="text"></div>
</div>
</div>

<!-- REMEMBER GOLFERS TOGGLE -->
<div class="toggle-row" onclick="toggleRemember()">
    <div class="toggle-box" id="rememberBox">＋</div>
    <div class="toggle-label">Remember These Golfers</div>
</div>

<button id="sendInvitesBtn">SEND INVITES</button>

</div>

<script>
document.addEventListener("DOMContentLoaded", function() {

    // LOAD COURSE FROM THE CURRENT ROUND
    const savedCourse = localStorage.getItem("selectedCourse");

    if (savedCourse) {
        const courseSelect = document.getElementById("courseName");

        const option = document.createElement("option");
        option.value = savedCourse;
        option.textContent = savedCourse;
        option.selected = true;

        courseSelect.appendChild(option);
    }

    // LOAD GAMES FROM THE CURRENT ROUND
    const savedGames = JSON.parse(localStorage.getItem("bb_games") || "[]");
    const gameSelect = document.getElementById("selectedGames");

    savedGames.forEach(function(game) {
        Array.from(gameSelect.options).forEach(function(option) {
            if (option.value === game) {
                option.selected = true;
            }
        });
    });

    // LIMIT TO 2 GAMES
    gameSelect.addEventListener("change", function() {
        const selected = Array.from(gameSelect.selectedOptions);

        if (selected.length > 2) {
            selected[selected.length - 1].selected = false;
            alert("You can select a maximum of 2 games.");
        }
    });

    // LOAD ROUND / ROOM NUMBER
    const savedRoomCode = localStorage.getItem("birdiebookieRoomCode");

    if (savedRoomCode) {
        document.getElementById("roomCode").value = savedRoomCode;
    }

    // SEND INVITES
    document.getElementById("sendInvitesBtn").addEventListener("click", async function() {

        const course = document.getElementById("courseName").value || "Golf Course";

        const games = Array.from(
            document.getElementById("selectedGames").selectedOptions
        ).map(option => option.value).join(", ") || "Golf";

        const room = document.getElementById("roomCode").value || "Not available";

        const message =
            "🏌️ BirdieBookie Golf Invitation\n\n" +
            "Course: " + course + "\n" +
            "Games: " + games + "\n" +
            "Round / Room Number: " + room + "\n\n" +
            "Join the round on BirdieBookie and use the Room Number above.";

        if (navigator.share) {
            try {
                await navigator.share({
                    title: "BirdieBookie Golf Invitation",
                    text: message
                });
            } catch (error) {
                if (error.name !== "AbortError") {
                    alert("Unable to open the share menu.");
                }
            }
        } else {
            try {
                await navigator.clipboard.writeText(message);
                alert("INVITATION COPIED!\n\nPaste it into a text, email, or Messenger.");
            } catch (error) {
                alert(message);
            }
        }
    });
});

function toggleExtra() {
    const box = document.getElementById("extraBox");
    const extra = document.getElementById("extra");
    const isOn = box.classList.toggle("on");
    box.textContent = isOn ? "✓" : "＋";
    extra.style.display = isOn ? "block" : "none";
}

function toggleRemember() {
    const box = document.getElementById("rememberBox");
    const isOn = box.classList.toggle("on");
    box.textContent = isOn ? "✓" : "＋";
}
</script>

</body>
</html>
