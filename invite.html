<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BirdieBookie - Invite Players</title>

<style>
body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

.wrap{
    max-width:1100px;
    margin:30px auto;
    padding:20px;
}

h1{
    color:#00ff99;
    text-align:center;
    font-size:52px;
}

.panel{
    border:2px solid #00ff99;
    border-radius:14px;
    padding:18px;
    margin-bottom:22px;
}

h2{
    color:#00ff99;
    margin:0 0 16px;
}

.grid3{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:20px;
}

label{
    display:block;
    font-weight:bold;
    margin-bottom:6px;
}

input[type="text"],
select{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:2px solid #00ff99;
    background:#111;
    color:#fff;
    font-size:18px;
    box-sizing:border-box;
}

#selectedGames{
    height:auto;
    min-height:150px;
}

.playerRow{
    display:grid;
    grid-template-columns:180px 1fr 1fr;
    gap:18px;
    align-items:center;
    border:2px solid #00ff99;
    border-radius:12px;
    padding:18px;
    margin:16px 0;
}

.playerTitle{
    font-size:30px;
    color:#00ff99;
    font-weight:bold;
}

.toggle-row{
    display:flex;
    align-items:center;
    gap:18px;
    margin:24px 0;
    cursor:pointer;
}

.toggle-box{
    width:60px;
    height:60px;
    border-radius:12px;
    border:3px solid #00ff99;
    background:#111;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
    flex-shrink:0;
    transition:background 0.2s;
}

.toggle-box.on{
    background:#00ff99;
    color:#000;
}

.toggle-label{
    font-size:28px;
    font-weight:bold;
    color:#00ff99;
}

#extra{
    display:none;
}

button{
    width:100%;
    padding:18px;
    font-size:30px;
    font-weight:bold;
    background:#00ff99;
    color:#000;
    border:none;
    border-radius:12px;
    cursor:pointer;
    margin-top:10px;
}

button:disabled{
    opacity:.6;
    cursor:wait;
}

@media (max-width:700px){

    .grid3{
        grid-template-columns:1fr;
    }

    .playerRow{
        grid-template-columns:1fr;
        gap:10px;
        padding:14px;
    }

    .playerTitle{
        font-size:24px;
    }

    h1{
        font-size:36px;
    }

    input[type="text"],
    select{
        font-size:16px;
        padding:10px;
    }

    .toggle-label{
        font-size:20px;
    }

    .toggle-box{
        width:44px;
        height:44px;
        font-size:24px;
    }
}
</style>
</head>

<body>

<div class="wrap">

<h1>🏌️ Invite Players</h1>

<div class="grid3">

    <!-- HOST -->
    <div class="panel">
        <h2>HOST INFORMATION</h2>

        <label>Host Name</label>
        <input type="text" id="hostName">
    </div>

   

    <!-- GAMES -->
    <div class="panel">
        <h2>GAMES</h2>

        <label>Selected Games</label>

        <select id="selectedGames" multiple size="4">
            <option value="Nassau">Nassau</option>
            <option value="Skins">Skins</option>
            <option value="Wolf">Wolf</option>
            <option value="Left Right">Left Right</option>
            <option value="Vegas">Vegas</option>
            <option value="Quota">Quota</option>
            <option value="Rabbit">Rabbit</option>
            <option value="Stableford">Stableford</option>
            <option value="Bingo Bango Bongo">Bingo Bango Bongo</option>
            <option value="Game of 9">Game of 9</option>
            <option value="Chairman">Chairman</option>
            <option value="Press">Press</option>
        </select>

        <label style="margin-top:12px;">
            Round / Room Number
        </label>

        <input type="text" id="roomCode" readonly>
    </div>

</div>


<!-- PLAYER 1 -->
<div class="playerRow">

    <div class="playerTitle">
        PLAYER 1
    </div>

    <div>
        <label>Name</label>
        <input type="text" class="playerName">
    </div>

    <div>
        <label>Phone Number</label>
        <input type="text" class="playerPhone">
    </div>

</div>


<!-- PLAYER 2 -->
<div class="playerRow">

    <div class="playerTitle">
        PLAYER 2
    </div>

    <div>
        <label>Name</label>
        <input type="text" class="playerName">
    </div>

    <div>
        <label>Phone Number</label>
        <input type="text" class="playerPhone">
    </div>

</div>


<!-- PLAYER 3 -->
<div class="playerRow">

    <div class="playerTitle">
        PLAYER 3
    </div>

    <div>
        <label>Name</label>
        <input type="text" class="playerName">
    </div>

    <div>
        <label>Phone Number</label>
        <input type="text" class="playerPhone">
    </div>

</div>


<!-- ADD GOLFERS -->
<div class="toggle-row" onclick="toggleExtra()">

    <div class="toggle-box" id="extraBox">
        ＋
    </div>

    <div class="toggle-label">
        Add Golfers 4–7
    </div>

</div>


<div id="extra">

    <!-- PLAYER 4 -->
    <div class="playerRow">

        <div class="playerTitle">
            PLAYER 4
        </div>

        <div>
            <label>Name</label>
            <input type="text" class="playerName">
        </div>

        <div>
            <label>Phone Number</label>
            <input type="text" class="playerPhone">
        </div>

    </div>


    <!-- PLAYER 5 -->
    <div class="playerRow">

        <div class="playerTitle">
            PLAYER 5
        </div>

        <div>
            <label>Name</label>
            <input type="text" class="playerName">
        </div>

        <div>
            <label>Phone Number</label>
            <input type="text" class="playerPhone">
        </div>

    </div>


    <!-- PLAYER 6 -->
    <div class="playerRow">

        <div class="playerTitle">
            PLAYER 6
        </div>

        <div>
            <label>Name</label>
            <input type="text" class="playerName">
        </div>

        <div>
            <label>Phone Number</label>
            <input type="text" class="playerPhone">
        </div>

    </div>


    <!-- PLAYER 7 -->
    <div class="playerRow">

        <div class="playerTitle">
            PLAYER 7
        </div>

        <div>
            <label>Name</label>
            <input type="text" class="playerName">
        </div>

        <div>
            <label>Phone Number</label>
            <input type="text" class="playerPhone">
        </div>

    </div>

</div>


<!-- REMEMBER GOLFERS -->
<div class="toggle-row" onclick="toggleRemember()">

    <div class="toggle-box" id="rememberBox">
        ＋
    </div>

    <div class="toggle-label">
        Remember These Golfers
    </div>

</div>


<!-- SEND -->
<button id="sendInvitesBtn">
    SEND INVITES
</button>

</div>


<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
        "https://wcbsfanihwqibojxrqns.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_IY6_FwkAvwrbn7QphyjEhQ_mDUEyQ05";


/* =========================================================
   PAGE LOAD
   ========================================================= */

document.addEventListener("DOMContentLoaded", async function(){

    loadHost();

    
    loadGames();

    await loadRoomNumber();

});


/* =========================================================
   HOST
   ========================================================= */

function loadHost(){

    const host =
        localStorage.getItem("hostName");

    if(host){

        document.getElementById("hostName").value =
            host;

    }

}


/* =========================================================
   COURSE
   ========================================================= */


/* =========================================================
   GAMES
   ========================================================= */

function loadGames(){

    const gameSelect =
        document.getElementById("selectedGames");

    let savedGames = [];

    try{

        savedGames =
            JSON.parse(
                localStorage.getItem("bb_games") || "[]"
            );

    }
    catch(error){

        savedGames = [];

    }


    savedGames.forEach(function(game){

        Array.from(gameSelect.options).forEach(function(option){

            if(option.value === game){

                option.selected = true;

            }

        });

    });


    gameSelect.addEventListener("change", function(){

        const selected =
            Array.from(gameSelect.selectedOptions);

        if(selected.length > 2){

            selected[selected.length - 1].selected =
                false;

            alert(
                "You can select a maximum of 2 games."
            );

        }

    });

}


/* =========================================================
   ROOM NUMBER
   ========================================================= */

async function loadRoomNumber(){

    const roomInput =
        document.getElementById("roomCode");


    /*
       FIRST TRY SUPABASE.

       This is the important part because the
       room belongs to the current scorekeeper
       device and is stored in birdiebookie_rounds.
    */

    const deviceId =
        localStorage.getItem(
            "birdiebookieDeviceId"
        );


    if(deviceId){

        try{

            const url =
                SUPABASE_URL +
                "/rest/v1/birdiebookie_rounds" +
                "?select=room_code" +
                "&scorekeeper_device=eq." +
                encodeURIComponent(deviceId) +
                "&limit=1";


            const response =
                await fetch(url, {

                    method:"GET",

                    headers:{
                        "apikey":SUPABASE_KEY,
                        "Authorization":
                            "Bearer " + SUPABASE_KEY
                    }

                });


            if(response.ok){

                const rows =
                    await response.json();


                if(
                    rows.length > 0 &&
                    rows[0].room_code
                ){

                    const roomCode =
                        rows[0].room_code;


                    localStorage.setItem(
                        "birdiebookieRoomCode",
                        roomCode
                    );


                    roomInput.value =
                        roomCode;


                    return;

                }

            }

        }
        catch(error){

            console.log(
                "Supabase room lookup error:",
                error
            );

        }

    }


    /*
       FALLBACK:
       Use the locally saved room number if
       Supabase did not return one.
    */

    const savedRoom =
        localStorage.getItem(
            "birdiebookieRoomCode"
        );


    if(savedRoom){

        roomInput.value =
            savedRoom;

    }

}


/* =========================================================
   SEND INVITE
   ========================================================= */

document
.getElementById("sendInvitesBtn")
.addEventListener("click", async function(){

    const button =
        document.getElementById("sendInvitesBtn");


    /* -----------------------------------------
       COURSE
       ----------------------------------------- */

    const course = "Golf Course";


    /* -----------------------------------------
       GAMES
       ----------------------------------------- */

    const games =
        Array.from(
            document
            .getElementById("selectedGames")
            .selectedOptions
        )
        .map(option => option.value)
        .join(", ") ||
        "Golf";


    /* -----------------------------------------
       ROOM
       ----------------------------------------- */

    const room =
        document
        .getElementById("roomCode")
        .value ||
        "";


    if(!room){

        alert(
            "The Room Number has not loaded yet.\n\n" +
            "Please wait a moment and try again."
        );

        return;

    }


    /* -----------------------------------------
       FIND FIRST ENTERED PLAYER
       ----------------------------------------- */

    const phoneInputs =
        Array.from(
            document.querySelectorAll(".playerPhone")
        );


    const nameInputs =
        Array.from(
            document.querySelectorAll(".playerName")
        );


    let playerPhone = "";

    let playerName = "";


    for(let i = 0; i < phoneInputs.length; i++){

        const phone =
            phoneInputs[i].value.trim();

        if(phone){

            playerPhone =
                phone.replace(/\D/g,"");

            if(nameInputs[i]){

                playerName =
                    nameInputs[i].value.trim();

            }

            break;

        }

    }


    if(!playerPhone){

        alert(
            "Please enter a player's phone number first."
        );

        return;

    }


    /* -----------------------------------------
       INVITATION TEXT
       ----------------------------------------- */

    let greeting =
        "Hi";

    if(playerName){

        greeting =
            "Hi " + playerName;

    }


    const message =
        greeting + "!\n\n" +
        "🏌️ BirdieBookie Golf Invitation\n\n" +
        "Course: " + course + "\n" +
        "Games: " + games + "\n" +
        "Round / Room Number: " + room + "\n\n" +
        "Open BirdieBookie and use the Room Number above to join the round.";


    button.disabled = true;


    try{

        /*
           MOBILE:
           Open the phone's SMS app directly with
           the phone number already entered and the
           complete invitation already filled in.
        */

        if(
            /Android|iPhone|iPad|iPod/i.test(
                navigator.userAgent
            )
        ){

            const smsUrl =
                "sms:" +
                playerPhone +
                "?body=" +
                encodeURIComponent(message);


            window.location.href =
                smsUrl;

        }

        /*
           DESKTOP:
           Keep the normal share/clipboard behavior.
        */

        else if(navigator.share){

            await navigator.share({

                title:
                    "BirdieBookie Golf Invitation",

                text:
                    message

            });

        }

        else{

            await navigator.clipboard.writeText(
                message
            );

            alert(
                "INVITATION COPIED!\n\n" +
                "Paste it into a text, email, or Messenger."
            );

        }

    }
    catch(error){

        console.log(
            "Invite error:",
            error
        );


        try{

            await navigator.clipboard.writeText(
                message
            );

            alert(
                "INVITATION COPIED!\n\n" +
                "Paste it into a text message."
            );

        }
        catch(copyError){

            alert(message);

        }

    }
    finally{

        button.disabled =
            false;

    }

});


/* =========================================================
   ADD GOLFERS
   ========================================================= */

function toggleExtra(){

    const box =
        document.getElementById("extraBox");

    const extra =
        document.getElementById("extra");


    const isOn =
        box.classList.toggle("on");


    box.textContent =
        isOn ? "✓" : "＋";


    extra.style.display =
        isOn ? "block" : "none";

}


/* =========================================================
   REMEMBER GOLFERS
   ========================================================= */

function toggleRemember(){

    const box =
        document.getElementById("rememberBox");


    const isOn =
        box.classList.toggle("on");


    box.textContent =
        isOn ? "✓" : "＋";

}

</script>

</body>
</html>
