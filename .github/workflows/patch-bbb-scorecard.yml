          text = text.replace(update_names_anchor, update_names_anchor + '\ndocument.getElementById("bbbName1").value = names[0];\ndocument.getElementById("bbbName2").value = names[1];\ndocument.getElementById("bbbName3").value = names[2];\ndocument.getElementById("bbbName4").value = names[3];', 1)

          listener_anchor = 'document.querySelectorAll(".chipbox").forEach(function(box) {'
          if listener_anchor not in text: raise SystemExit('bbb listener anchor not found')
          bbb_listener = 'document.querySelectorAll(".bbbbox").forEach(function(box) { box.addEventListener("input", updateBingoBangoBongo); });\n\n'
          # Avoid adding a second listener block if the function block above already created it.
          text = text.replace(listener_anchor, bbb_listener + listener_anchor, 1)

          leaderboard_anchor = '    if (JSON.parse(localStorage.getItem("selectedGames") || "[]").some(g => g.includes("Rabbit"))) updateRabbitMoney(money);'
          if leaderboard_anchor not in text: raise SystemExit('bbb leaderboard anchor not found')
          text = text.replace(leaderboard_anchor, leaderboard_anchor + '\n    updateBingoBangoBongoMoney(money);', 1)

          vegas_anchor = "if (savedGames.some(g => g.includes('Vegas'))) {\n    document.getElementById('vegasSection').style.display = 'block';\n}"
          if vegas_anchor not in text: raise SystemExit('bbb visibility anchor not found')
          text = text.replace(vegas_anchor, vegas_anchor + "\nif (savedGames.some(g => String(g).toLowerCase().includes('bingo') && String(g).toLowerCase().includes('bango'))) {\n    document.getElementById('bingoBangoBongoSection').style.display = 'block';\n}", 1)

          path.write_text(text, encoding='utf-8')
          print('Patched scorecards.html successfully.')
      
      - name: Commit patched scorecard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git add scorecards.html
          git commit -m "Add compact Bingo Bango Bongo ledger to scorecard"
