          anchor = '    <div style="padding:30px;">\n\n<!-- CHIP AMOUNT SELECTOR -->'
          if anchor not in text:
              raise SystemExit('BBB HTML anchor not found')
          text = text.replace(anchor, html + '\n' + anchor, 1)

          js = r'''let bbbPointValue = Number(localStorage.getItem("bbbPointValue") || "1");
function bbbIsSelected() {
    return JSON.parse(localStorage.getItem("selectedGames") || "[]").some(function(g) {
        const s = String(g).toLowerCase();
        return s.includes("bingo") && s.includes("bango");
    });
}
function updateBingoBangoBongo() {
    const rows = ["bbb1","bbb2","bbb3","bbb4"].map(function(id){ return document.querySelectorAll("#" + id + " .bbbbox"); });
    if (rows.some(function(r){ return r.length !== 21; })) return;
    let completed = 0, bad = 0;
    for (let hole = 0; hole < 18; hole++) {
        const boxes = rows.map(function(r){ return r[hole]; });
        let total = 0, entered = false;
        boxes.forEach(function(b){ const v = b.value.trim(); if (v !== "") { entered = true; total += parseInt(v,10) || 0; } });
        boxes.forEach(function(b){ b.classList.remove("bbb-valid","bbb-invalid","bbb-blank"); b.classList.add(!entered ? "bbb-blank" : (total === 3 ? "bbb-valid" : "bbb-invalid")); });
        if (!entered) continue;
        if (total === 3) completed++; else bad++;
    }
    ["bbb1","bbb2","bbb3","bbb4"].forEach(function(id){
        const boxes = document.querySelectorAll("#" + id + " .bbbbox");
        let out=0, inn=0;
        for(let i=0;i<=8;i++) out += parseInt(boxes[i].value,10) || 0;
        for(let i=10;i<=18;i++) inn += parseInt(boxes[i].value,10) || 0;
        boxes[9].value = out || "";
        boxes[19].value = inn || "";
        boxes[20].value = (out + inn) || "";
    });
    const status = document.getElementById("bbbRoundStatus");
    if (status) status.textContent = bad ? ("⚠ " + bad + " hole" + (bad === 1 ? " is" : "s are") + " not at 3 points yet.") : (completed ? (completed + " hole" + (completed === 1 ? "" : "s") + " completed at 3 points.") : "Enter points as they are won. Every completed hole must total 3.");
    localStorage.setItem("bbbPointValue", String(bbbPointValue));
    localStorage.setItem("bbbScores", JSON.stringify([1,2,3,4].map(function(n){ return Array.from(document.querySelectorAll("#bbb" + n + " .bbbbox")).slice(0,18).map(function(b){ return b.value; }); })));
    if (typeof updateLeaderboard === "function") updateLeaderboard();
}
function updateBingoBangoBongoMoney(money) {
    if (!bbbIsSelected()) return;
    const value = Number(bbbPointValue) || 1;
    const rows = ["bbb1","bbb2","bbb3","bbb4"].map(function(id){ return document.querySelectorAll("#" + id + " .bbbbox"); });
    if (rows.some(function(r){ return r.length !== 21; })) return;
    for (let hole=0; hole<18; hole++) {
        const points = rows.map(function(r){ return parseInt(r[hole].value,10) || 0; });
        if (points.some(function(p){ return p<0 || p>3; })) continue;
        const total = points.reduce(function(a,b){ return a+b; },0);
        const any = points.some(function(p){ return p!==0; });
        if (!any || total !== 3) continue;
        points.forEach(function(p,i){ money[i] += (4*p - 3) * value; });
    }
}
function loadBingoBangoBongo() {
    try {
        const data = JSON.parse(localStorage.getItem("bbbScores") || "null");
        if (Array.isArray(data) && data.length === 4) data.forEach(function(row,i){
            const boxes = document.querySelectorAll("#bbb" + (i+1) + " .bbbbox");
            (row || []).forEach(function(v,j){ if (boxes[j]) boxes[j].value = v; });
        });
        document.querySelectorAll(".bbb-value").forEach(function(btn){ btn.classList.toggle("bbb-active", Number(btn.dataset.value) === bbbPointValue); });
        updateBingoBangoBongo();
    } catch(e) {}
}
document.querySelectorAll(".bbb-value").forEach(function(btn){
    btn.addEventListener("click", function(){
        bbbPointValue = Number(btn.dataset.value) || 1;
        document.querySelectorAll(".bbb-value").forEach(function(b){ b.classList.remove("bbb-active"); });
        btn.classList.add("bbb-active");
        updateBingoBangoBongo();
    });
});
document.querySelectorAll(".bbbbox").forEach(function(box){ box.addEventListener("input", updateBingoBangoBongo); });
loadBingoBangoBongo();'''
          text = text.replace('</style>\n</head>', '<style>\n.bbb-value{background:#111;color:#00ff99;border:2px solid #00ff99;border-radius:20px;padding:7px 14px;font-weight:bold;cursor:pointer;margin:2px;}\n.bbb-active{background:#00ff99;color:#000;}\n</style>\n</head>', 1)
          text = text.replace('function computeNassauDiffs() {', js + '\n\nfunction computeNassauDiffs() {', 1)

          update_names_anchor = 'document.getElementById("vgName4").value = names[3];'
