          <input class="bbbbox" type="number" min="0" max="3" step="1"><input class="bbbbox" type="number" min="0" max="3" step="1"><input class="bbbbox" type="number" min="0" max="3" step="1"><input class="bbbbox" type="number" min="0" max="3" step="1"><input class="bbbbox" type="number" min="0" max="3" step="1"><input class="bbbbox" type="number" min="0" max="3" step="1"><input class="bbbbox" type="number" min="0" max="3" step="1"><input class="bbbbox" type="number" min="0" max="3" step="1"><input class="bbbbox" type="number" min="0" max="3" step="1"><input class="bbbbox total-box" readonly><input class="bbbbox" type="number" min="0" max="3" step="1"><input class="bbbbox" type="number" min="0" max="3" step="1"><input class="bbbbox" type="number" min="0" max="3" step="1"><input class="bbbbox" type="number" min="0" max="3" step="1"><input class="bbbbox" type="number" min="0" max="3" step="1"><input class="bbbbox" type="number" min="0" max="3" step="1"><input class="bbbbox" type="number" min="0" max="3" step="1"><input class="bbbbox" type="number" min="0" max="3" step="1"><input class="bbbbox" type="number" min="0" max="3" step="1"><input class="bbbbox total-box" readonly><input class="bbbbox total-box" readonly></div>
